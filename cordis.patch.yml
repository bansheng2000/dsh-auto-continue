# dsh-auto-continue — 异常中断自动继续
#
# 注册一个条目 `auto-continue`。默认 enabled=true，装上即生效：
# 只有「非正常中断」才会被补一句「继续」，用户自己点的终止一律不管。
#
# 判定依据是宿主 loop 的 abort cause（`AgentCancelCause`）：
#   user     用户自己点的终止（sessionController.cancel → agent.cancel({kind:'user'})）
#   parent   父级/上级停的
#   disposed 会话被释放
#   hook     插件通过 cancel({kind:'hook'}) 停的
#   legacy   旧格式/无法归类
# 默认把 parent / disposed / legacy / unknown 当异常，user 与 hook 不动。
#
# 配置写在本条目的 config 里（优先级最低，可被设置卡片覆盖）：
#   rules:
#     enabled: true
#     causes: [parent, disposed, legacy, unknown]
#     kinds: [error, interrupted, max-tokens]
#     prompt: "继续"
#     maxRetries: 3
# prompt 是补发的那句话（去首尾空白、超长截断到 2000 字符）；
# maxRetries 是同一会话最多自动续几次，防 runaway。
#
# kinds 管的是「不是 aborted、但也没正常收尾」的轮次（turn/end 的 reason.kind）：
#   error        这一轮报错了（最常见：上游 429 / 超时 / 模型返回不合法）
#   interrupted  这一轮被中断
#   max-tokens   撞上输出长度上限
# 想把某类排除就把它从 kinds 里删掉；写成 [] = 全禁（不写这个键才用默认三个，
# 两者含义不同——以前 [] 会静默回落默认，配置写的和实际做的正好相反，已改）。
# cause 认不出来（unknown，即 abort 的 cause 缺失/形态不认识）只续 1 次，第二次记进 lastSkip；
# 宿主以后新增的**有名字**的 cause 不在名单里 → 一次都不续（要续就把它加进 causes）。
# 状态路由只服务回环：Host 不是 127.0.0.1 / localhost / ::1 一律 403（这条路由不在
# 宿主 /api/* 的鉴权墙后面，而本机 cloudflared 隧道会把公网请求以 127.0.0.1 送达）。
#
# 续跑节奏：同一会话第 1 次立即续；第 2 次起先退避再续（2s 起步、×2 递增、
# ±30% 抖动、上限 30s），避免上游 429 时几秒内原地撞满 maxRetries（每撞一次
# 都是一轮无效的 LLM 调用）。退避期间同一会话不会重复排队；插件卸载时定时器会被清掉。
#
# 用 `- insert:` 包裹：bundle patch 里顶层 `- id:` 只会被 loader 当成
# 「改已有条目配置」，条目不存在时是空操作（plugin_manager list_bundles 会把
# 它列进 overrides 而不是 rows）——插件根本挂不上。必须 insert 出新行。
# profile 自己的 cordis.patch.yml 里那条扁平 `- id: auto-continue` 才是配置覆盖层。
- insert:
    - id: auto-continue
      name: dsh-auto-continue
      config:
        rules:
          enabled: true
          prompt: "继续"
          maxRetries: 3
          causes:
            - parent
            - disposed
            - legacy
            - unknown
          kinds:
            - error
            - interrupted
            - max-tokens
